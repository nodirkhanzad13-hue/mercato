<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercato Global</title>
<style>
:root{--bg:#f4f6f6;--card:#fff;--tx:#10242b;--mu:#62767c;--ac:#0e6b78;--ac2:#fff;--sf:#f2a93b;--bd:#dbe5e6;--hd:#ffe58a;--sk:#e6ecee;--rd:#e5412d;--L1:91%;--L2:84%;--sh:rgba(16,36,43,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b171b;--card:#13252b;--tx:#e8f1f2;--mu:#8fa5aa;--ac:#4cc3d1;--ac2:#04181c;--bd:#223a41;--hd:#33300f;--sk:#1c3037;--L1:20%;--L2:25%;--sh:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b171b;--card:#13252b;--tx:#e8f1f2;--mu:#8fa5aa;--ac:#4cc3d1;--ac2:#04181c;--bd:#223a41;--hd:#33300f;--sk:#1c3037;--L1:20%;--L2:25%;--sh:rgba(0,0,0,.6);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sf);outline-offset:2px}
.hero{background:var(--hd);border-radius:0 0 26px 26px;padding-top:12px}
.addr{padding:0 18px;cursor:pointer;border:0;background:none;text-align:left;display:block}
.addr small{display:block;font-size:12px;color:var(--mu)}.addr b{font-size:17px}
.slider{overflow:hidden;border-radius:18px;margin:12px 14px 0}
.track{display:flex;transition:transform .5s}
.sl{flex:none;width:100%;display:flex;align-items:center;gap:10px;padding:16px;min-height:118px;color:#10242b}
.sl>div{flex:1}.sl h2{margin:0 0 4px;font-size:20px;line-height:1.15;letter-spacing:-.02em}.sl p{margin:0;font-size:13px}
.s1{background:#fff7c2}.s2{background:#0e6b78;color:#fff}.s3{background:#ffd3c8}
.em{font-size:54px}
.go{flex:none;width:40px;height:40px;border-radius:50%;background:#10242b;color:#fff;border:0;font-size:24px;line-height:1}
.dots{display:flex;justify-content:center;gap:6px;padding:10px 0 14px}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--mu);opacity:.4;transition:width .3s}
.dots i.on{width:20px;background:var(--ac);opacity:1}
