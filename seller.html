<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercato Sotuvchi</title>
<style>
:root{--bg:#f4f6f6;--card:#fff;--tx:#10242b;--mu:#62767c;--ac:#0e6b78;--ac2:#fff;--sf:#f2a93b;--bd:#dbe5e6;--hd:#ffe58a;--sk:#e6ecee;--rd:#e5412d;--gr:#1f9d63}
@media (prefers-color-scheme:dark){:root{--bg:#0b171b;--card:#13252b;--tx:#e8f1f2;--mu:#8fa5aa;--ac:#4cc3d1;--ac2:#04181c;--bd:#223a41;--hd:#33300f;--sk:#1c3037;--gr:#47d18b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 96px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.top{background:var(--hd);border-radius:0 0 24px 24px;padding:14px 18px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top small{display:block;color:var(--mu);font-size:12px}.top b{font-size:20px}
.out{border:0;background:rgba(0,0,0,.1);border-radius:10px;padding:8px 12px;font-weight:600}
main{padding:14px}h3{margin:16px 0 10px;font-size:17px}
.card,.row{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:12px;align-items:center;cursor:pointer}
.tl{flex:none;width:60px;height:60px;border-radius:14px;overflow:hidden;display:grid;place-items:center;font-size:26px;background:var(--sk)}
.tl img,.ph img{width:100%;height:100%;object-fit:cover}
.m{flex:1;min-width:0}.m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu{color:var(--mu);font-size:14px}.ln{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ch{font-size:12px;font-weight:700;border-radius:20px;padding:4px 10px;white-space:nowrap;background:var(--sk)}
.s-pending,.s-new{background:color-mix(in srgb,var(--sf) 32%,transparent)}
.s-active,.s-delivered{background:color-mix(in srgb,var(--gr) 22%,transparent);color:var(--gr)}
.s-hidden{background:color-mix(in srgb,var(--rd) 20%,transparent);color:var(--rd)}
.s-packing{background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac)}
.s-shipping{background:color-mix(in srgb,#4a7cf0 22%,transparent);color:#4a7cf0}
.btn{width:100%;margin-top:12px;border:0;border-radius:12px;background:var(--ac);color:var(--ac2);padding:14px;font-weight:700;font-size:16px;display:block;text-align:center}
